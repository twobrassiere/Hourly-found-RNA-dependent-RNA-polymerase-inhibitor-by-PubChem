name: Hourly PubChem RdRp Analysis & Sync with Email Notification

on:
  schedule:
    # 每小時第 0 分鐘自動觸發執行一次 (UTC 時間)
    - cron: '0 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上點擊手動觸發
  

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 3.10 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝必要 Python 套件
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pubchempy gspread google-auth requests

      # 4. 帶入 Secrets 並執行 PubChem 分析與同步腳本
      - name: Run PubChem Analysis Script
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python pubchem.py

     
